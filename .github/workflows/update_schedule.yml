name: Update Schedule

on:
  schedule:
    # 06:00 and 22:00 Moscow / Kazan time (UTC+3) -> 03:00 and 19:00 UTC
    - cron: '0 3,19 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which parser(s) to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ivmiit
          - physics
          - ifmib
          - curriculum_ivmiit
          - curriculum_physics
          - curriculum_ifmib

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run schedule parser (IVMIIT)
        if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'ivmiit'
        run: python parser.py

      - name: Run curriculum parser (IVMIIT)
        if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'curriculum_ivmiit'
        run: python curriculum_parser.py

      - name: Run schedule parser (Physics)
        if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'physics'
        run: python parser_physics.py

      - name: Run curriculum parser (Physics)
        if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'curriculum_physics'
        run: python curriculum_parser_physics.py

      - name: Run schedule parser (IFMiB)
        if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'ifmib'
        run: python parser_ifmib.py

      - name: Run curriculum parser (IFMiB)
        if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'curriculum_ifmib'
        run: python curriculum_parser_ifmib.py

      - name: Run unit tests
        run: python -m unittest discover tests

      - name: Merge schedules (IVMIIT + Physics + IFMiB)
        if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'ivmiit' || inputs.target == 'physics' || inputs.target == 'ifmib'
        run: python merge_schedules.py

      - name: Validate merged schedule sanity
        if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'ivmiit' || inputs.target == 'physics' || inputs.target == 'ifmib'
        run: |
          python -c "
          import json, sys
          with open('schedule_combined.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          groups = data.get('groups', [])
          print(f'Total groups parsed: {len(groups)}')
          if len(groups) < 150:
              print(f'Error: Group count ({len(groups)}) is suspiciously low (< 150). Aborting to prevent committing corrupted schedule.', file=sys.stderr)
              sys.exit(1)
          "

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json curriculum_ivmiit.json schedule_physics.json curriculum_physics.json schedule_ifmib.json curriculum_ifmib.json schedule_combined.json
          if git diff --staged --quiet; then
            echo "No changes in schedule or curriculum."
          else
            git commit -m "Automated data update (target: ${{ github.event_name == 'schedule' && 'all' || inputs.target }}) [skip ci]"
            git push
          fi
