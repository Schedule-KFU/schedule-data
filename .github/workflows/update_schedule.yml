name: Update Schedule

on:
  schedule:
    # 06:00 and 22:00 Moscow / Kazan time (UTC+3) -> 03:00 and 19:00 UTC
    - cron: '0 3,19 * * *'
  workflow_dispatch:        # Allows manual run from GitHub Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run schedule parser (IVMIIT)
        run: python parser.py

      - name: Run curriculum parser (IVMIIT)
        run: python curriculum_parser.py

      - name: Run schedule parser (Physics)
        run: python parser_physics.py

      - name: Run curriculum parser (Physics)
        run: python curriculum_parser_physics.py

      - name: Merge schedules (IVMIIT + Physics)
        run: python merge_schedules.py

      - name: Validate merged schedule sanity
        run: |
          python -c "
          import json, sys
          with open('schedule_combined.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          groups = data.get('groups', [])
          print(f'Total groups parsed: {len(groups)}')
          if len(groups) < 100:
              print(f'Error: Group count ({len(groups)}) is suspiciously low (< 100). Aborting to prevent committing corrupted schedule.', file=sys.stderr)
              sys.exit(1)
          "

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json curriculum_ivmiit.json schedule_physics.json curriculum_physics.json schedule_combined.json
          if git diff --staged --quiet; then
            echo "No changes in schedule or curriculum."
          else
            git commit -m "Automated data update (IVMIIT & Physics) [skip ci]"
            git push
          fi
